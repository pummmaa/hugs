baseURL: "https://notes.naruu.xyz"
languageCode: "en-us"
title: "My Notes"
theme: "PaperMod"
paginate: 10

# Required for PaperMod search
outputs:
  home:
    - HTML
    - RSS
    - JSON

buildDrafts: false
buildFuture: false
buildExpired: false
enableRobotsTXT: true
enableEmoji: true

# ─────────────────────────────────────────────
# PaperMod Parameters
# ─────────────────────────────────────────────
params:
  env: production
  title: "My Notes"
  description: "Personal knowledge base and technical notes"
  author: "Ricardo"

  # Theme
  defaultTheme: auto
  ShowThemeToggle: true

  # Post features
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowToc: true
  TocOpen: true
  ShowLastMod: true
  ShowAllPagesInArchive: true

  # Homepage info section
  homeInfoParams:
    Title: "📝 My Knowledge Base"
    Content: >
      Personal notes on Linux, DevOps, Programming, and more.
      Use the search or browse by category below.

  # Social icons
  socialIcons:
    - name: gitlab
      url: "https://gitlab.com/yourusername"
    - name: rss
      url: "/index.xml"

  # Built-in Fuse.js search config
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys:
      - title
      - permalink
      - summary
      - content

  # "Edit on GitLab" link on every page
  editPost:
    URL: "https://gitlab.com/yourusername/hugs/edit/main/content"
    Text: "Edit on GitLab"
    appendFilePath: true

  # Assets
  assets:
    favicon: "/images/favicon.ico"
    favicon16x16: "/images/favicon-16x16.png"
    favicon32x32: "/images/favicon-32x32.png"
    apple_touch_icon: "/images/apple-touch-icon.png"

# ─────────────────────────────────────────────
# Markup / Syntax Highlighting
# ─────────────────────────────────────────────
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

# ─────────────────────────────────────────────
# Menu
# ─────────────────────────────────────────────
menu:
  main:
    - identifier: search
      name: 🔍 Search
      url: /search/
      weight: 1
    - identifier: archives
      name: 📚 Archives
      url: /archives/
      weight: 2
    - identifier: linux
      name: Linux
      url: /linux/
      weight: 3
    - identifier: devops
      name: DevOps
      url: /devops/
      weight: 4
    - identifier: programming
      name: Programming
      url: /programming/
      weight: 5
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 6

# ─────────────────────────────────────────────
# Taxonomies
# ─────────────────────────────────────────────
taxonomies:
  tag: tags
  category: categories
  series: series
