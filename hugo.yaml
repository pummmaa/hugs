baseURL: "https://notes.naruu.xyz"
languageCode: "en-us"
title: "Nottas"
theme: "hugo-book"

enableGitInfo: true

# Book theme parameters
params:
  BookTheme: "auto"          # light, dark, or auto
  BookToC: true              # Table of contents on right side
  BookSection: "/"           # Root section for sidebar
  BookRepo: ""               # Remove to hide edit button
  BookSearch: true           # Built-in search
  BookDateFormat: "Jan 2, 2006"
  BookComments: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: gruvbox-dark
    codeFences: true
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 4

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu: {}   # Book uses folder structure for nav, no manual menu needed
